
name: Build and Deploy Vue 3 SPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CuoiKi

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        
          cache-dependency-path: CuoiKi/package-lock.json

      # 3. Cài đặt thư viện
      - name: Install Dependencies
        run: npm ci

      # 4. Kiểm tra code
      - name: Run Lint
        run: npm run lint --if-present

      # 5. Chạy kiểm thử
      - name: Run Tests
        run: npm test --if-present

      # 6. Build dự án
      - name: Build Project
        run: npm run build

      # 7. Deploy lên Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./CuoiKi
          vercel-args: '--prod'
